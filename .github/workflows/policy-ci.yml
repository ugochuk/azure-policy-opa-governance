name: Policy CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  opa-tests:
    name: OPA Unit Tests and Fixture Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

      - name: Format Rego
        run: opa fmt --write policies tests

      - name: Run OPA Tests
        run: opa test policies tests -v

      - name: Evaluate Compliant Fixture
        run: |
          violations=$(opa eval --format=json --data policies --input examples/compliant-plan.json 'data.azure.governance.deny' | jq '.result[0].expressions[0].value | length')
          echo "Compliant fixture violations: ${violations}"
          test "${violations}" -eq 0

      - name: Evaluate Noncompliant Fixture
        run: |
          violations=$(opa eval --format=json --data policies --input examples/noncompliant-plan.json 'data.azure.governance.deny' | jq '.result[0].expressions[0].value | length')
          echo "Noncompliant fixture violations: ${violations}"
          test "${violations}" -gt 0

  terraform-validation:
    name: Terraform Example Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Format
        run: terraform fmt -check -recursive examples

      - name: Terraform Init
        working-directory: examples/compliant
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: examples/compliant
        run: terraform validate

  azure-policy-validation:
    name: Validate Azure Policy JSON
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON
        run: jq empty azure-policy/*.json
